<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<div style="min-height:100vh;background:radial-gradient(1200px 800px at 50% 20%, #16181c 0%, #0b0c0e 70%);display:flex;align-items:center;justify-content:center;padding:28px;font-family:'Titillium Web',sans-serif;color:#c9ced6;">

        <div style="font-weight:400;font-size:19px;letter-spacing:3.5px;color:#e8ebf0;text-shadow:0 1px 0 #000;white-space:nowrap;">{{ trackName }}</div>

          <path d="{{ miniPath }}" fill="none" stroke="#4a5058" stroke-width="42" stroke-linejoin="round" stroke-linecap="round"></path>
          <path d="{{ miniHi }}" fill="none" stroke="#39ff6e" stroke-width="46" stroke-linejoin="round" stroke-linecap="round" filter="url(#miniGlow)"></path>
          <filter id="miniGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="26" result="b"></feGaussianBlur>
            <feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
          </filter>
        </svg>
        <div style="font-size:12px;letter-spacing:2px;color:#6d7480;white-space:nowrap;">{{ cornerName }}</div>
      </div>
      <div style="display:flex;align-items:center;gap:14px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <button onClick="{{ prev }}" style="{{ navBtn }}">◀</button>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#6d7480;min-width:52px;text-align:center;">{{ counter }}</div>
          <button onClick="{{ next }}" style="{{ navBtn }}">▶</button>
        </div>
        <div style="width:1px;height:18px;background:#2c3037;"></div>
        <div style="display:flex;align-items:center;gap:8px;">

      </div>

          </pattern>

            <stop offset="100%" stop-color="#0d0e11" stop-opacity="1"></stop>
          </linearGradient>

            <stop offset="0%" stop-color="{{ lineColor }}" stop-opacity="1"></stop>
            <stop offset="100%" stop-color="{{ lineColor }}" stop-opacity="0.22"></stop>
          </linearGradient>
          <mask id="idealReveal" maskUnits="userSpaceOnUse" x="100" y="-80" width="800" height="880">
            <path d="{{ idealPath }}" fill="none" stroke="#fff" stroke-width="14" pathLength="1" stroke-dasharray="1 1" style="{{ revealStyle }}"></path>
          </mask>
          <filter id="glow" filterUnits="userSpaceOnUse" x="100" y="-80" width="800" height="880">
            <feGaussianBlur stdDeviation="3.2" result="b"></feGaussianBlur>

          </filter>

        </sc-for>
        <sc-if value="{{ showIdealLine }}" hint-placeholder-val="{{ false }}">

        <path d="{{ userPath }}" fill="none" stroke="url(#userFade)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"></path>

                  </div>
                </sc-if>

            </div>
            <button onClick="{{ enterLeaderboard }}" disabled="{{ enterDisabled }}" style="{{ enterStyle }}" style-active="{{ enterActive }}">ENTER LEADERBOARD</button>
          </div>
        </sc-if>
      </div>
    </div>
    </div>
  </div>
</div>

      userPath += ' C ' + [an[i].outx, an[i].outy, an[i+1].inx, an[i+1].iny, an[i+1].x, an[i+1].y].map(v => v.toFixed(1)).join(' ');
    }
    const idealShown = !!r || (this.props.showIdeal ?? false);
    const exiting = !!this.state.exiting;
    const anchorsView = (idealShown && !exiting) ? [] : an.map((a, i) => {
      const locked = i === 0;
      return { x: a.x, y: a.y, inx: a.inx, iny: a.iny, outx: a.outx, outy: a.outy,
        hasIn: i > 0, hasOut: i < an.length - 1,
        fill: locked ? 'url(#knobStart)' : 'url(#knob)',
        gStyle: exiting ? 'pointer-events:none;' : '',
        hStyle: exiting ? 'transform-box:view-box;transform-origin:' + a.x + 'px ' + a.y + 'px;animation:handleCollapse .22s ease-in forwards;' : '',
        hkStyle: (exiting ? 'transform-box:view-box;transform-origin:' + a.x + 'px ' + a.y + 'px;animation:handleCollapse .22s ease-in forwards;' : 'cursor:grab;'),
        aStyle: exiting
          ? 'transform-box:view-box;transform-origin:' + a.x + 'px ' + a.y + 'px;animation:anchorVanish .26s .2s ease-in forwards;'
          : (locked ? 'cursor:default;' : 'cursor:move;'),
        downA: this.startDrag('a', i), downIn: this.startDrag('in', i), downOut: this.startDrag('out', i) };
    });
    const mix = (hex, tgt, f) => {
      const h = (s) => [parseInt(s.slice(1,3),16), parseInt(s.slice(3,5),16), parseInt(s.slice(5,7),16)];
      const a = h(hex), b = h(tgt);
      return '#' + a.map((v, i) => Math.round(v + (b[i]-v)*f).toString(16).padStart(2,'0')).join('');
    };
    const knobColor = '#39ff6e';
    const lim = this.halfW - 7;
    const railsView = an.map(a => {
      const b = this.ptAtS(a.s);
      return { x1: b.x - b.nx*lim, y1: b.y - b.ny*lim, x2: b.x + b.nx*lim, y2: b.y + b.ny*lim };
    });
    const cx = this.center.reduce((s, p) => s + p.x, 0) / this.center.length;
    const cy = this.center.reduce((s, p) => s + p.y, 0) / this.center.length;
    const labels = {};
    an.forEach((a, i) => {
      const b = this.ptAtS(a.s);
      const sign = ((b.x - cx) * b.nx + (b.y - cy) * b.ny) >= 0 ? 1 : -1;
      const d = this.halfW + 22;
      const k = 'l' + (i + 1);
      labels[k + 'x'] = b.x + sign * b.nx * d;
      labels[k + 'y'] = b.y + sign * b.ny * d;
      labels[k + 'ty'] = labels[k + 'y'] + 4.2;
    });
    const idle = !this.state.dirty;
    const enterDisabled = (this.state.driverName || '').length !== 3;
    const btn = 'font-family:\'Titillium Web\',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;border-radius:10px;padding:13px 18px;';
    const resetStyle = idle
      ? btn + 'color:#4b515a;background:#1a1d21;border:1px solid #23262b;cursor:not-allowed;box-shadow:0 2px 5px rgba(0,0,0,.4) inset;'
      : btn + 'color:#9aa2ad;background:linear-gradient(180deg,#2c3037,#191c20);border:1px solid #3c4048;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.08) inset;';
    const cbtn = 'font-family:\'Titillium Web\',sans-serif;font-weight:900;font-size:16px;letter-spacing:3px;border-radius:14px;padding:20px 18px;';
    const checkStyle = idle
      ? cbtn + 'color:#2b4b38;background:#141a16;border:1px solid #1e2a22;cursor:not-allowed;box-shadow:0 2px 6px rgba(0,0,0,.45) inset;'
      : cbtn + 'animation:checkWake .42s cubic-bezier(.34,1.56,.64,1) both;color:#0d1a12;background:linear-gradient(180deg,#63f79a 0%,#2fd06e 55%,#1a9a4d 100%);border:1px solid #6dfba2;cursor:pointer;text-shadow:0 1px 0 rgba(255,255,255,.35);box-shadow:0 10px 24px rgba(47,208,110,.28), 0 2px 0 rgba(255,255,255,.45) inset, 0 -6px 12px rgba(0,0,0,.28) inset;';
    const enterStyle = enterDisabled
      ? cbtn + 'color:#4b515a;background:#1a1d21;border:1px solid #23262b;cursor:not-allowed;box-shadow:0 2px 6px rgba(0,0,0,.45) inset;'
      : cbtn + 'animation:checkWake .42s cubic-bezier(.34,1.56,.64,1) both;color:#14171b;background:linear-gradient(180deg,#ffffff 0%,#e9ebee 55%,#cdd0d4 100%);border:1px solid #ffffff;cursor:pointer;text-shadow:0 1px 0 rgba(255,255,255,.6);box-shadow:0 10px 24px rgba(255,255,255,.16), 0 2px 0 rgba(255,255,255,.55) inset, 0 -6px 12px rgba(0,0,0,.28) inset;';
    // same dark chrome as the prev/next puzzle nav buttons, just larger, with a logo instead of a label
    const navChrome = 'display:flex;align-items:center;justify-content:center;cursor:pointer;background:linear-gradient(180deg,#2c3037,#191c20);border:1px solid #3c4048;box-shadow:0 2px 6px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.07) inset;';
    const selTeam = this.teams.find(t => t.code === this.state.team) || this.teams[0];
    const teamBtnStyle = 'width:44px;height:44px;flex-shrink:0;border-radius:10px;padding:7px;position:relative;' + navChrome;
    const chevronStyle = 'position:absolute;right:-6px;bottom:-6px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#3a3f47,#22262c);border:1px solid #4a4f58;box-shadow:0 2px 4px rgba(0,0,0,.5);pointer-events:none;';
    const teamMenuStyle = 'position:absolute;bottom:52px;left:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#16181c;border:1px solid #3c4048;border-radius:10px;padding:12px;box-shadow:0 10px 24px rgba(0,0,0,.55);z-index:20;width:190px;';
    const teamOptions = this.teams.map(t => ({
      code: t.code,
      logo: t.logo,
      select: () => this.selectTeam(t.code),
      rowStyle: 'width:34px;height:34px;border-radius:8px;padding:5px;' + navChrome
        + (t.code === selTeam.code ? 'border-color:#39ff6e;box-shadow:0 2px 6px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.07) inset, 0 0 8px rgba(57,255,110,.45);' : ''),
    }));
    const nameInputStyle = 'flex:1;min-width:0;font-family:\'IBM Plex Mono\',monospace;font-weight:600;font-size:16px;letter-spacing:5px;text-align:center;text-transform:uppercase;color:#e6e8eb;background:linear-gradient(180deg,#0e1013 0%,#0a0c0e 100%);border:1px solid #060907;box-shadow:0 0 0 1px #23262b, 0 6px 14px rgba(0,0,0,.5) inset;border-radius:10px;padding:0 4px;outline:none;';
    const board = this.getBoard(this.state.idx);
    const boardRows = board.map((e, i) => {
      const team = this.teams.find(t => t.code === e.team) || this.teams[0];
      return {
        rowStyle: 'display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 8px;'
          + (i < board.length - 1 ? 'border-bottom:1px solid #2c3037;' : ''),
        leftStyle: 'display:flex;align-items:center;gap:8px;min-width:0;',
        swatchStyle: 'width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;',
        logo: team.logo,
        name: e.name,
        deltaStyle: i === 0 ? 'font-size:9.5px;font-weight:700;letter-spacing:1px;color:#ffd23f;text-align:right;flex-shrink:0;' : 'font-size:9.5px;color:#8b929c;text-align:right;flex-shrink:0;',
        deltaText: i === 0 ? 'LEADER' : (e.delta >= 0 ? '+' : '') + e.delta.toFixed(2) + 's',
      };
    });
    const pz = this.puzzles[this.state.idx];
    let miniPath = '', miniHi = '', miniBox = '0 0 100 100', miniW = 0;
    if (pz.mini) {
      const P = [];
      for (let i = 0; i < pz.mini.length; i += 2) P.push([pz.mini[i], pz.mini[i+1]]);
      const xs = P.map(p => p[0]), ys = P.map(p => p[1]);
      const mnx = Math.min(...xs), mxx = Math.max(...xs), mny = Math.min(...ys), mxy = Math.max(...ys);
      const pad = 34, bw = mxx - mnx + pad*2, bh = mxy - mny + pad*2;
      miniBox = (mnx - pad) + ' ' + (mny - pad) + ' ' + bw + ' ' + bh;
      miniW = Math.round(40 * bw / bh);
      miniPath = 'M ' + P.map(p => p[0] + ' ' + p[1]).join(' L ') + ' Z';
      const [a, b] = pz.hi, seg = [];
      for (let i = a; ; i = (i + 1) % P.length) { seg.push(P[i]); if (i === b) break; }
      miniHi = 'M ' + seg.map(p => p[0] + ' ' + p[1]).join(' L ');
    }
    const animVal = this.state.animTime != null ? this.state.animTime : (r ? r.deltaNum : 0);
    const animText = (animVal >= 0 ? '+' : '') + animVal.toFixed(2);
    // colour tracks the value currently on screen, not just the final result, so it
    // sweeps yellow -> green -> (maybe) purple in step with the countdown
    const liveBoard = this.getBoard(this.state.idx);
    const liveRank = 1 + liveBoard.filter(b => b.delta < animVal).length;
    const timeColor = liveRank === 1 ? '#c77dff' : liveRank > 10 ? '#ffd23f' : '#4ff08a';
    const timeGlow = liveRank === 1 ? 'rgba(199,125,255,.6)' : liveRank > 10 ? 'rgba(255,210,63,.55)' : 'rgba(79,240,138,.6)';
    const timeStyle = 'font-size:17px;font-weight:600;letter-spacing:1px;color:' + timeColor + ';text-shadow:0 0 8px ' + timeGlow + ';';
    const st = this.center[this.startIdx];
    const deg = Math.atan2(st.ty, st.tx) * 180 / Math.PI;
    const navBtn = 'width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#9aa2ad;font-family:\'Titillium Web\',sans-serif;font-size:12px;background:linear-gradient(180deg,#2c3037,#191c20);border:1px solid #3c4048;box-shadow:0 2px 6px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.07) inset;';
    return {
      trackName: pz.track, cornerName: pz.corners,
      miniPath, miniHi, miniBox, miniW,
      counter: String(this.state.idx + 1).padStart(2, '0') + ' / ' + String(this.puzzles.length).padStart(2, '0'),
      prev: () => this.step(-1), next: () => this.step(1), navBtn,
      carStyle: 'position:absolute;left:' + ((st.x - 150) / 690 * 100).toFixed(2) + '%;top:' + ((st.y - 8) / 712 * 100).toFixed(2)
        + '%;width:10.9%;transform:translate(-50%,-50%) rotate(' + deg.toFixed(1) + 'deg);pointer-events:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.6));',
      startT: 'translate(' + st.x.toFixed(1) + ',' + st.y.toFixed(1) + ') rotate(' + (deg + 90).toFixed(1) + ')',
      labelT: 'translate(' + (st.x + st.nx * (this.halfW + 34)).toFixed(1) + ',' + (st.y + st.ny * (this.halfW + 34) + 4).toFixed(1) + ')',
      trackPath: this.trackPath,
      fadeT0: this.fades[0].t, fadeT1: this.fades[1].t,
      idle, enterDisabled, enterStyle, resetStyle, checkStyle,
      resetActive: idle ? '' : 'transform:translateY(1px);box-shadow:0 1px 3px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.6) inset;',
      checkActive: idle ? '' : 'transform:translateY(2px);box-shadow:0 4px 10px rgba(0,0,0,.5), 0 5px 12px rgba(0,0,0,.35) inset;',
      enterActive: enterDisabled ? '' : 'transform:translateY(2px);box-shadow:0 4px 10px rgba(0,0,0,.3), 0 5px 12px rgba(0,0,0,.2) inset;',
      ...labels, labelsShown: true, railsView, knobColor, accentLight: mix(knobColor, '#ffffff', 0.6), accentDark: mix(knobColor, '#000000', 0.55),
      svgRef: this.svgRef, onMove: this.onMove, onUp: this.onUp,
      reset: this.reset, check: this.check, enterLeaderboard: this.enterLeaderboard,
      driverName: this.state.driverName, onNameInput: this.onNameInput, nameInputStyle,
      teamLogo: selTeam.logo, teamBtnStyle, chevronStyle, teamMenuStyle, teamMenuOpen: !!this.state.teamMenuOpen, toggleTeamMenu: this.toggleTeamMenu, teamOptions,
      boardRows,
      userPath, anchorsView,
      idealPath: this.idealPathStr,
      revealStyle: exiting ? 'animation:idealDraw .62s .12s ease-out both;' : 'stroke-dashoffset:0;',
      showIdealLine: idealShown,
      hasResult: !!r, noResult: !r,
      frechetM: r ? r.frechetM : '', devM: r ? r.devM : '', position: r ? r.position : '',
      animText, timeStyle,
      lineColor: this.props.lineColor ?? '#ffffff',
    };
  }
}
</script>
